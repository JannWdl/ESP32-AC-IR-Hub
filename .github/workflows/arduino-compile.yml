name: Arduino Compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib update-index
          arduino-cli lib install IRremoteESP8266
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Create dummy config
        shell: bash
        run: |
          cp firmware/esp32_ac_ir_hub/config.example.h firmware/esp32_ac_ir_hub/config.h
          cp firmware/raw_replay_example/config.example.h firmware/raw_replay_example/config.h

      - name: Compile hub firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/esp32_ac_ir_hub

      - name: Compile IR reader
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ir_reader

      - name: Compile raw replay example
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/raw_replay_example
